[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lignamb-topology"
version = "0.1.0"
description = "Generate LignAmb25-compatible lignin topology inputs from an S/G/H composition."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vaishnavey", email = "vaishnavey@gmail.com" }]

[tool.setuptools]
packages = ["lignamb_topology"]
